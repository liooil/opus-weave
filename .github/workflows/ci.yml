name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test "src/tests/"
      - run: bun run smoke
      # This builds BunDesk and verifies the embedded AudioWorklet/file assets.
      - run: bun run build
      - name: Build static PWA
        if: runner.os == 'Linux'
        run: bun run build:web
