<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpusWeave</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header>
    <h1>OpusWeave</h1>
    <p class="tagline">From idea to score to performance.</p>
  </header>

  <main>
    <!-- SoundFont loader -->
    <section id="section-soundfont" class="panel">
      <h2>SoundFont</h2>
      <div class="row">
        <label for="sf-file">Load .sf2 / .sf3 / .sfogg</label>
        <input id="sf-file" type="file" accept=".sf2,.sf3,.sfogg,.dls" />
      </div>
      <div id="sf-status" class="status">No SoundFont loaded.</div>
    </section>

    <!-- MIDI player -->
    <section id="section-player" class="panel">
      <h2>MIDI Player</h2>
      <div class="row">
        <label for="midi-file">Load .mid file</label>
        <input id="midi-file" type="file" accept=".mid,.midi" />
      </div>
      <div id="midi-status" class="status">No file loaded.</div>
      <div class="controls">
        <button id="btn-play" disabled>▶ Play</button>
        <button id="btn-pause" disabled>⏸ Pause</button>
        <button id="btn-stop" disabled>⏹ Stop</button>
        <span id="playback-time">0:00 / 0:00</span>
      </div>
      <div class="row">
        <label for="playback-speed">Speed</label>
        <input id="playback-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
        <span id="playback-speed-label">1.00×</span>
      </div>
    </section>

    <!-- WebMIDI input -->
    <section id="section-midi-input" class="panel">
      <h2>MIDI Input</h2>
      <div class="row">
        <label for="midi-input-select">Device</label>
        <select id="midi-input-select"><option value="">— no device —</option></select>
        <button id="btn-refresh-midi">Refresh</button>
      </div>
      <div id="midi-input-status" class="status">WebMIDI not initialized.</div>
      <div id="midi-monitor" class="midi-monitor"></div>
    </section>

    <!-- Recording -->
    <section id="section-record" class="panel">
      <h2>Record Performance</h2>
      <div class="controls">
        <button id="btn-record" disabled>● Record</button>
        <button id="btn-record-stop" disabled>■ Stop</button>
        <button id="btn-record-export" disabled>⬇ Export .mid</button>
      </div>
      <div id="record-status" class="status">Select a MIDI input device to enable recording.</div>
    </section>
  </main>

  <script type="module" src="./app.ts"></script>
</body>
</html>
